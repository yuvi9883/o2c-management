# =============================================
# O2C Management - Application Configuration
# =============================================

# Server
server.port=${PORT:8080}

# Database - ✅ FIXED — uses Railway environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/o2c_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:9883}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:o2cSuperSecretKey1234567890ABCDEFabcdefghijklmnopqrstuvwxyz}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.o2c=INFO