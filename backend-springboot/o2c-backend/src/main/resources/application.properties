# =============================================
# O2C Management - Application Configuration
# =============================================

# Server
server.port=8080

# Database - UPDATE these with your MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/o2c_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=9883
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=o2cSuperSecretKey1234567890ABCDEFabcdefghijklmnopqrstuvwxyz
app.jwt.expiration=86400000

# CORS — must match your React dev server port
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.o2c=INFO